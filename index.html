<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daylight — Daily Planner</title><style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap');:root{--ink:#15231b;--sub:#667368;--paper:#f7f7f1;--line:#e4e6dc;--lime:#d7fa65;--forest:#1c5b42;--cream:#fffdf8}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px 'DM Sans',sans-serif}main{max-width:1280px;margin:auto;padding:28px}.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:42px}.logo{font-size:21px;font-weight:700;letter-spacing:-1px}.logo b{display:inline-block;background:var(--lime);border-radius:50%;height:9px;width:9px;margin-left:3px}.profile{display:flex;gap:11px;align-items:center;color:var(--sub)}.avatar{background:#203e30;color:white;height:34px;width:34px;border-radius:50%;display:grid;place-items:center;font-weight:700}.shell{display:grid;grid-template-columns:1.05fr 1.75fr;gap:20px}.hero{border-radius:28px;background:var(--forest);color:white;min-height:590px;padding:38px;position:relative;overflow:hidden}.hero:after{content:'';position:absolute;border:1px solid #ffffff31;width:430px;height:430px;border-radius:50%;right:-155px;bottom:-155px}.eyebrow{text-transform:uppercase;letter-spacing:1.5px;font-size:11px;color:#b5cebd}.hero h1{font:600 clamp(42px,5vw,68px)/.98 Fraunces,serif;letter-spacing:-3px;margin:19px 0}.hero p{max-width:270px;color:#d3e1d6;line-height:1.7}.date-card{position:absolute;bottom:30px;left:34px;right:34px;padding:18px;border:1px solid #ffffff26;border-radius:18px;background:#ffffff10;backdrop-filter:blur(8px)}.date-card strong{display:block;font-size:25px;margin-top:4px}.workspace{padding:8px 4px}.workspace header{display:flex;align-items:end;justify-content:space-between;margin:3px 0 24px}.workspace h2{font:600 34px/1 Fraunces,serif;margin:0;letter-spacing:-1px}.workspace small{color:var(--sub)}.progress{background:var(--cream);border:1px solid var(--line);border-radius:20px;padding:20px 22px;margin-bottom:16px;display:flex;align-items:center;gap:18px}.ring{height:52px;width:52px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--forest) var(--p,0%),#edf0e9 0);position:relative}.ring:before{content:'';background:var(--cream);height:42px;width:42px;border-radius:50%;position:absolute}.ring span{position:relative;font-size:11px;font-weight:700}.progress b{font-size:15px}.progress p{margin:4px 0 0;color:var(--sub)}.composer{display:flex;background:#fff;border:1px solid var(--line);padding:7px;border-radius:16px;margin-bottom:12px;box-shadow:0 11px 25px #20342508}.composer input{flex:1;border:0;outline:0;padding:11px 13px;font:inherit}.composer button,.clear{border:0;border-radius:11px;background:var(--ink);color:white;font:600 13px 'DM Sans';padding:11px 16px;cursor:pointer}.list{background:#fff;border:1px solid var(--line);border-radius:20px;padding:7px 20px}.task{display:flex;align-items:center;gap:13px;padding:17px 0;border-bottom:1px solid #eef0e9}.task:last-child{border:0}.task input{appearance:none;width:20px;height:20px;border:1.5px solid #bcc7bd;border-radius:7px;cursor:pointer}.task input:checked{background:var(--lime);border-color:var(--lime)}.task input:checked:after{content:'✓';display:block;text-align:center;font-weight:800;font-size:13px}.task span{flex:1;font-size:15px}.task.done span{text-decoration:line-through;color:#9aa49a}.del{border:0;background:none;color:#a6aea7;font-size:20px;cursor:pointer}.empty{padding:38px 0;color:var(--sub);text-align:center}.footer-row{display:flex;justify-content:space-between;align-items:center;margin:15px 2px;color:var(--sub)}.clear{background:#e9eee8;color:#395343;padding:9px 13px}@media(max-width:800px){main{padding:17px}.shell{grid-template-columns:1fr}.hero{min-height:360px}.workspace{padding-top:16px}.hero h1{font-size:49px}}</style><main><nav class="nav"><div class="logo">daylight<b></b></div><div class="profile"><span id="today"></span><i class="avatar">DP</i></div></nav><section class="shell"><aside class="hero"><div class="eyebrow">Personal command centre</div><h1>Make space<br>for your best work.</h1><p>A considered daily view for priorities that actually matter.</p><div class="date-card"><span class="eyebrow">Today</span><strong id="date"></strong></div></aside><section class="workspace"><header><div><small>YOUR FOCUS LIST</small><h2>Today, simply.</h2></div><small id="count">0 of 0 complete</small></header><div class="progress"><div class="ring" id="ring"><span id="percent">0%</span></div><div><b>Small steps add up.</b><p>Finish one clear task, then move to the next.</p></div></div><form class="composer" id="form"><input id="entry" maxlength="100" placeholder="What needs your attention?" required><button>Add task</button></form><div class="list" id="list"></div><div class="footer-row"><span>Changes are saved automatically</span><button class="clear" id="clear">Clear completed</button></div></section></section></main><script>const key='daylight.tasks',today=new Date().toISOString().slice(0,10);let tasks=JSON.parse(localStorage.getItem(key)||'[]').filter(t=>t.day===today);const fmt=new Intl.DateTimeFormat(undefined,{weekday:'long',month:'long',day:'numeric'});date.textContent=fmt.format(new Date());document.querySelector('#today').textContent=new Intl.DateTimeFormat(undefined,{month:'short',day:'numeric'}).format(new Date());const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){list.innerHTML=tasks.length?tasks.map((t,i)=>`<div class="task ${t.done?'done':''}"><input type="checkbox" data-i="${i}" ${t.done?'checked':''}><span>${esc(t.text)}</span><button class="del" data-d="${i}" aria-label="Delete">×</button></div>`).join(''):'<div class="empty">Your day is open. Add your first priority.</div>';let n=tasks.filter(t=>t.done).length,p=tasks.length?Math.round(n/tasks.length*100):0;count.textContent=`${n} of ${tasks.length} complete`;percent.textContent=p+'%';ring.style.setProperty('--p',p+'%');document.querySelectorAll('[data-i]').forEach(x=>x.onchange=()=>{tasks[+x.dataset.i].done=x.checked;save()});document.querySelectorAll('[data-d]').forEach(x=>x.onclick=()=>{tasks.splice(+x.dataset.d,1);save()})}function save(){localStorage.setItem(key,JSON.stringify(tasks));fetch('/api/state',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({tasks})}).catch(()=>{});render()}form.onsubmit=e=>{e.preventDefault();tasks.unshift({text:entry.value.trim(),done:false,day:today});entry.value='';save()};clear.onclick=()=>{tasks=tasks.filter(t=>!t.done);save()};fetch('/api/state').then(r=>r.json()).then(s=>{if(s.tasks?.length){tasks=s.tasks.filter(t=>t.day===today);localStorage.setItem(key,JSON.stringify(tasks));render()}}).catch(()=>{});render();</script></html>
